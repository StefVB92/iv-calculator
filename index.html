const vals=[null,null,null], circles=Array.from('⓪①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮');const $=id=>document.getElementById(id);['Attack','Defence','Health'].forEach((name,i)=>{const section=document.createElement('section');section.className='stat';section.innerHTML=`<div class="line"><span>${name}</span><div class="bar">${[0,1,2].map(s=>`<div class="segment"><div class="fill" id="f${i}${s}"></div></div>`).join('')}</div><span class="value" id="v${i}">–/15</span></div><div class="keys">${Array.from({length:16},(_,n)=>`<button aria-label="${name} ${n}" aria-pressed="false" data-i="${i}" data-n="${n}">${n}</button>`).join('')}</div>`;$('stats').append(section)});function render(){vals.forEach((v,i)=>{$('v'+i).textContent=(v??'–')+'/15';for(let s=0;s<3;s++){const f=$('f'+i+s);f.style.width=Math.max(0,Math.min(5,(v??0)-s*5))*20+'%';f.style.background=v===15?'#e65b78':'#efa34c'}document.querySelectorAll(`[data-i="${i}"]`).forEach(b=>b.setAttribute('aria-pressed',String(v===Number(b.dataset.n))))});$('calc').disabled=vals.includes(null);$('out').textContent='—';$('status').textContent=''}document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{vals[Number(b.dataset.i)]=Number(b.dataset.n);render()});async function copy(t){try{await navigator.clipboard.writeText(t);return true}catch(e){const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.append(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}a.remove();return ok}}$('calc').onclick=async()=>{const r=Math.round(vals.reduce((a,b)=>a+b,0)/45*100)+vals.map(v=>circles[v]).join('');$('out').textContent=r;$('status').textContent=await copy(r)?'Copied to clipboard!':'Could not copy. Select the output manually.'};$('reset').onclick=()=>{vals.fill(null);render();$('friendStatus').textContent=''};$('friend').onclick=async()=>{$('friendStatus').textContent=await copy('282311610773')?'Trainer code copied!':'Could not copy: 282311610773';setTimeout(()=>$('friendStatus').textContent='',3000)};render();
const pages={menu:['Help & Information',`<div class="helpnav"><button data-page="free">Free to use &amp; Affiliation<br><small>Free forever. No hidden fees.</small></button><button data-page="use">How to use<br><small>Instructions and IV reference chart.</small></button><button data-page="install">Add to Home Screen<br><small>Install on iPhone, iPad or Android.</small></button></div>`],free:['Free to use & Affiliation',`<h3>100% free. Always.</h3><p>IV Calculator is completely free to use. There are no payments, subscriptions, advertisements or hidden fees.</p><p><strong>If you paid for this app, please request a refund from whoever charged you. You should never have to pay for it.</strong></p><h3>Affiliation</h3><p>IV Calculator is an unofficial, fan-made tool. It is not affiliated with, endorsed by or sponsored by Pokémon GO, its developers or The Pokémon Company. All Pokémon-related trademarks belong to their respective owners.</p><p>Created by StefVB, for the Pokémon GO community.</p>`],use:['How to use',`<p>IV Calculator converts your Pokémon’s IVs into a compact, copyable nickname.</p><h3>1. Appraise your Pokémon</h3><p>Open Pokémon GO, select a Pokémon, open its menu and tap Appraise.</p><h3>2. Read the IV bars</h3><p>Each bar has three segments of 5 points. Compare the filled portions with this reference chart. A full pink bar means 15.</p><div class="ref">${Array.from({length:8},(_,n)=>[n,n+8]).flat().map(v=>`<div class="refrow"><span>${v}</span><div class="bar">${[0,1,2].map(s=>`<div class="segment"><div class="fill" style="width:${Math.max(0,Math.min(5,v-s*5))*20}%;background:${v===15?'#e65b78':'#efa34c'}"></div></div>`).join('')}</div></div>`).join('')}</div><h3>3. Select your IVs</h3><p>Select Attack, Defence and Health. Double-check that the bars match Pokémon GO.</p><h3>4. Calculate &amp; Copy</h3><p>Tap Calculate &amp; Copy to calculate and copy the rounded overall IV percentage followed by the three IVs.</p><div class="output"><strong style="font-size:26px">98⑮⑭⑮</strong><p>98% · Attack 15 · Defence 14 · Health 15</p></div><h3>5. Rename your Pokémon</h3><p>Return to Pokémon GO, edit the nickname and paste the result.</p>`],install:['Add to Home Screen',`<p>Use IV Calculator just like a regular app.</p><h3>iPhone &amp; iPad</h3><ol><li>Open IV Calculator in Safari.</li><li>Tap Share (you may need to open the browser menu first).</li><li>Select Add to Home Screen.</li><li>Enable Open as Web App if offered, then tap Add.</li></ol><h3>Android</h3><ol><li>Open IV Calculator in Chrome.</li><li>Tap the three-dot menu.</li><li>Select Add to Home screen or Install app.</li><li>Confirm.</li></ol><h3>Works offline</h3><p>After the app has successfully cached its files online, it can work without an internet connection. No app store, account or payment required.</p>`]};
function showHelp(page){$('helpTitle').textContent=pages[page][0];$('back').hidden=page==='menu';$('helpBody').innerHTML=pages[page][1]+(page==='menu'?'':'<button class="backbottom" data-page="menu">← Back to help</button>');$('helpBody').querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>showHelp(b.dataset.page));$('helpBody').insertAdjacentHTML('beforeend','<div class="version">v1.1.2</div>');$('helpBody').scrollTop=0;}
$('help').onclick=()=>{showHelp('menu');$('helpDialog').showModal()};$('back').onclick=()=>showHelp('menu');$('closeHelp').onclick=()=>$('helpDialog').close();
// Restore selections only after an intentional update.
try{const saved=JSON.parse(sessionStorage.getItem('iv-update-values')||'null');sessionStorage.removeItem('iv-update-values');if(Array.isArray(saved)&&saved.length===3&&saved.every(v=>v===null||(Number.isInteger(v)&&v>=0&&v<=15))){saved.forEach((v,i)=>vals[i]=v);render()}}catch(e){}
if('serviceWorker' in navigator && location.protocol==='https:'){
 const VERSION='1.1.2'; let reg, applying=false, candidate=null, generation=0;
 const btn=$('update');
 function versionOf(w){return new Promise(resolve=>{const ch=new MessageChannel();const timer=setTimeout(()=>{ch.port1.close();resolve(null)},1500);ch.port1.onmessage=e=>{clearTimeout(timer);ch.port1.close();resolve(e.data?.version||null)};try{w.postMessage({type:'GET_VERSION'},[ch.port2])}catch(e){clearTimeout(timer);resolve(null)}})}
 function newer(v){if(!/^\d+\.\d+\.\d+$/.test(v||''))return false;const a=v.split('.').map(Number),b=VERSION.split('.').map(Number);for(let i=0;i<3;i++){if(a[i]!==b[i])return a[i]>b[i]}return false}
 async function refresh(){const g=++generation,w=reg?.waiting; if(applying)return; const v=w?await versionOf(w):null;if(g!==generation||applying)return;candidate=w&&reg.waiting===w&&newer(v)?w:null;btn.hidden=!candidate;btn.disabled=false;btn.textContent='Update available — Tap to update';}
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(applying){location.reload()}else refresh()});
 btn.onclick=()=>{if(!candidate||reg.waiting!==candidate){refresh();return}try{sessionStorage.setItem('iv-update-values',JSON.stringify(vals))}catch(e){}applying=true;btn.disabled=true;btn.textContent='Updating…';candidate.postMessage({type:'SKIP_WAITING'});setTimeout(()=>{if(applying){applying=false;refresh()}},10000)};
 navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>{reg=r;const watch=w=>w?.addEventListener('statechange',refresh);watch(r.installing);r.addEventListener('updatefound',()=>watch(r.installing));const check=()=>{refresh();if(navigator.onLine)r.update().then(refresh).catch(()=>{})};document.addEventListener('visibilitychange',()=>{if(!document.hidden)check()});window.addEventListener('online',check);window.addEventListener('focus',check);check()}).catch(()=>{});
}
