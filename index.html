</style></head><body><main><header><h1>IV Calculator</h1><small>by StefVB</small><button id="reset">Reset</button></header><button id="update" hidden>Update available — Tap to update</button><div id="stats"></div><div class="output"><small>Output</small><div id="out">—</div><div id="status" role="status"></div></div><button id="calc" disabled>Calculate &amp; Copy</button><nav class="secondary-actions" aria-label="Help and history"><button id="help" aria-label="Help"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 2.5-3 4m.1 3h.01"/></svg><span>Help</span></button><button id="history" aria-label="Calculation history" title="History"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/><path d="M3 3v5h5m4-1v5l3 2"/></svg><span>History</span></button></nav><footer><button id="friend">Be my friend</button><div id="friendStatus" role="status"></div><div class="version">v1.2.1</div></footer></main><dialog id="helpDialog"><div class="helphead"><button id="back" aria-label="Back">←</button><h2 id="helpTitle">Help &amp; Information</h2><button id="closeHelp" aria-label="Close">×</button></div><div id="helpBody"></div></dialog><dialog id="historyDialog"><div class="helphead"><h2>History</h2><small id="historyCount"></small><button id="closeHistory" aria-label="Close">×</button></div><div id="historyBody"></div><div class="historyfooter"><div id="historyStatus" role="status"></div><button id="clearHistory">Clear history</button><div id="historyConfirm" hidden><p>Delete all calculation history?</p><button id="cancelClear">Cancel</button><button id="confirmClear">Delete all</button></div><p style="text-align:center;margin-bottom:0"><small>History is stored locally on your device.</small></p></div></dialog><script>
const vals=[null,null,null], circles=Array.from('⓪①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮');const $=id=>document.getElementById(id);['Attack','Defence','Health'].forEach((name,i)=>{const section=document.createElement('section');section.className='stat';section.innerHTML=`<div class="line"><span>${name}</span><div class="bar">${[0,1,2].map(s=>`<div class="segment"><div class="fill" id="f${i}${s}"></div></div>`).join('')}</div><span class="value" id="v${i}">–/15</span></div><div class="keys">${Array.from({length:16},(_,n)=>`<button aria-label="${name} ${n}" aria-pressed="false" data-i="${i}" data-n="${n}">${n}</button>`).join('')}</div>`;$('stats').append(section)});function render(){vals.forEach((v,i)=>{$('v'+i).textContent=(v??'–')+'/15';for(let s=0;s<3;s++){const f=$('f'+i+s);f.style.width=Math.max(0,Math.min(5,(v??0)-s*5))*20+'%';f.style.background=v===15?'#e65b78':'#efa34c'}document.querySelectorAll(`[data-i="${i}"]`).forEach(b=>b.setAttribute('aria-pressed',String(v===Number(b.dataset.n))))});$('calc').disabled=vals.includes(null);$('out').textContent='—';$('status').textContent=''}document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{vals[Number(b.dataset.i)]=Number(b.dataset.n);render()});async function copy(t){try{await navigator.clipboard.writeText(t);return true}catch(e){const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.append(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}a.remove();return ok}}$('calc').onclick=async()=>{const r=Math.round(vals.reduce((a,b)=>a+b,0)/45*100)+vals.map(v=>circles[v]).join('');$('out').textContent=r;recordHistory(r);$('status').textContent=await copy(r)?'Copied to clipboard!':'Could not copy. Select the output manually.'};$('reset').onclick=()=>{vals.fill(null);render();$('friendStatus').textContent=''};$('friend').onclick=async()=>{$('friendStatus').textContent=await copy('282311610773')?'Trainer code copied!':'Could not copy: 282311610773';setTimeout(()=>$('friendStatus').textContent='',3000)};render();
const pages={menu:['Help & Information',`<div class="helpnav"><button data-page="free">Free to use &amp; Affiliation<br><small>Free forever. No hidden fees.</small></button><button data-page="use">How to use<br><small>Instructions and IV reference chart.</small></button><button data-page="history">Calculation History<br><small>View and reuse previous calculations.</small></button><button data-page="install">Add to Home Screen<br><small>Install on iPhone, iPad or Android.</small></button><button data-page="updates">App Updates<br><small>How automatic updates work.</small></button></div>`],free:['Free to use & Affiliation',`<h3>100% free. Always.</h3><p>IV Calculator is completely free to use. There are no payments, subscriptions, advertisements or hidden fees.</p><p><strong>If you paid for this app, please request a refund from whoever charged you. You should never have to pay for it.</strong></p><h3>Affiliation</h3><p>IV Calculator is an unofficial, fan-made tool. It is not affiliated with, endorsed by or sponsored by Pokémon GO, its developers or The Pokémon Company. All Pokémon-related trademarks belong to their respective owners.</p><p>Created by StefVB, for the Pokémon GO community.</p>`],use:['How to use',`<p>IV Calculator converts your Pokémon’s IVs into a compact, copyable nickname.</p><h3>1. Appraise your Pokémon</h3><p>Open Pokémon GO, select a Pokémon, open its menu and tap Appraise.</p><h3>2. Read the IV bars</h3><p>Each bar has three segments of 5 points. Compare the filled portions with this reference chart. A full pink bar means 15.</p><div class="ref">${Array.from({length:8},(_,n)=>[n,n+8]).flat().map(v=>`<div class="refrow"><span>${v}</span><div class="bar">${[0,1,2].map(s=>`<div class="segment"><div class="fill" style="width:${Math.max(0,Math.min(5,v-s*5))*20}%;background:${v===15?'#e65b78':'#efa34c'}"></div></div>`).join('')}</div></div>`).join('')}</div><h3>3. Select your IVs</h3><p>Select Attack, Defence and Health. Double-check that the bars match Pokémon GO.</p><h3>4. Calculate &amp; Copy</h3><p>Tap Calculate &amp; Copy to calculate and copy the rounded overall IV percentage followed by the three IVs.</p><div class="output"><strong style="font-size:26px">98⑮⑭⑮</strong><p>98% · Attack 15 · Defence 14 · Health 15</p></div><h3>5. Rename your Pokémon</h3><p>Return to Pokémon GO, edit the nickname and paste the result.</p>`],install:['Add to Home Screen',`<p>Use IV Calculator just like a regular app.</p><h3>iPhone &amp; iPad</h3><ol><li>Open IV Calculator in Safari.</li><li>Tap Share (you may need to open the browser menu first).</li><li>Select Add to Home Screen.</li><li>Enable Open as Web App if offered, then tap Add.</li></ol><h3>Android</h3><ol><li>Open IV Calculator in Chrome.</li><li>Tap the three-dot menu.</li><li>Select Add to Home screen or Install app.</li><li>Confirm.</li></ol><h3>Works offline</h3><p>After the app has successfully cached its files online, it can work without an internet connection. No app store, account or payment required.</p>`]};
pages.updates=['App Updates',`<p>IV Calculator automatically checks for updates when you open or return to the app while connected to the internet.</p><h3>Installing an update</h3><p>When a newer version is ready, a blue <strong>Update available — Tap to update</strong> button appears on the main screen. Tap it to reload the app with the latest version.</p><p>Your selected IVs and calculated output are preserved when you update using this button. The app does not copy anything to your clipboard again.</p><h3>No reinstallation needed</h3><p>Updates are free. You can keep using the same home screen icon. Your browser may also apply an update automatically when the app is closed.</p><h3>Offline use</h3><p>Without an internet connection, you can continue using the last successfully cached version. Updates require an internet connection.</p><h3>Current version</h3><p>You can find your installed version below Be my friend on the main screen.</p>`];

const HISTORY_KEY='iv-calculator-history';
let historyEntries=[];
try{const raw=JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');if(Array.isArray(raw))historyEntries=raw.filter(e=>e&&typeof e.value==='string'&&Number.isFinite(e.time)&&Number.isInteger(e.count)&&e.count>0).slice(0,100)}catch(e){}
let historyStorageOK=true;
function saveHistory(){try{localStorage.setItem(HISTORY_KEY,JSON.stringify(historyEntries));historyStorageOK=true}catch(e){historyStorageOK=false}}
function recordHistory(value){const time=Date.now();if(historyEntries[0]?.value===value){historyEntries[0].time=time;historyEntries[0].count++}else{historyEntries.unshift({value,time,count:1});historyEntries.length=Math.min(historyEntries.length,100)}saveHistory()}
function formatHistoryTime(time){const d=new Date(time);return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})+' · '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false})}
const copyIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>';
const trashIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 10v6m4-6v6"/></svg>';
function renderHistory(){const body=$('historyBody');body.replaceChildren();$('historyCount').textContent=historyEntries.length+' / 100';$('clearHistory').disabled=!historyEntries.length;$('historyStatus').textContent=historyStorageOK?'':'History could not be saved on this device.';const intro=document.createElement('p');intro.textContent=historyEntries.length?'Tap a previous result to copy it again.':'No calculations yet.';body.append(intro);historyEntries.forEach((entry,i)=>{const row=document.createElement('div');row.className='historyrow';const result=document.createElement('button');result.className='historyresult';const value=document.createElement('strong');value.textContent=entry.value;result.append(value);if(i===0){const latest=document.createElement('span');latest.className='latest';latest.textContent='Latest';result.append(latest)}const time=document.createElement('small');time.textContent=formatHistoryTime(entry.time)+(entry.count>1?' (x'+entry.count+')':'');result.append(time);const doCopy=async()=>{$('historyStatus').textContent=await copy(entry.value)?'Copied to clipboard!':'Could not copy.'};result.onclick=doCopy;const c=document.createElement('button');c.innerHTML=copyIcon;c.setAttribute('aria-label','Copy '+entry.value);c.onclick=doCopy;const del=document.createElement('button');del.innerHTML=trashIcon;del.setAttribute('aria-label','Delete '+entry.value);del.onclick=()=>{historyEntries.splice(i,1);saveHistory();renderHistory()};row.append(result,c,del);body.append(row)})}
function confirmHistory(show){$('historyConfirm').hidden=!show;$('clearHistory').hidden=show}
$('history').onclick=()=>{confirmHistory(false);renderHistory();$('historyDialog').showModal();$('historyBody').scrollTop=0};$('closeHistory').onclick=()=>$('historyDialog').close();$('clearHistory').onclick=()=>confirmHistory(true);$('cancelClear').onclick=()=>confirmHistory(false);$('confirmClear').onclick=()=>{historyEntries=[];saveHistory();confirmHistory(false);renderHistory()};
pages.history=['Calculation History',`<h3>Your calculation history</h3><p>Every time you tap Calculate &amp; Copy, your result is automatically saved. The most recent result appears at the top.</p><h3>Repeated calculations</h3><p>Consecutive identical results are grouped into one entry. Its date and time are updated and a counter shows how many times the result was calculated consecutively. Identical results separated by a different calculation are saved separately.</p><div class="output"><strong style="font-size:26px">98⑮⑭⑮</strong><p>24 Nov 2026 · 21:42 (x12)</p></div><p>This result was calculated 12 times in a row.</p><h3>Reuse previous results</h3><p>Tap a result or its copy icon to copy it again. This does not change its timestamp, counter or position.</p><h3>Manage your history</h3><p>Use the trash icon to delete an entry or Clear history to delete all entries. Up to 100 entries are stored; the oldest is removed when the limit is reached.</p><h3>Privacy &amp; storage</h3><p>History is stored locally on your device and normally survives closing or updating the app. No account is required and no calculation data is sent to a server. Clearing browser or app data may permanently delete your history.</p>`];

function showHelp(page){$('helpTitle').textContent=pages[page][0];$('back').hidden=page==='menu';$('helpBody').innerHTML=pages[page][1];$('helpBody').querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>showHelp(b.dataset.page));$('helpBody').scrollTop=0;}
$('help').onclick=()=>{showHelp('menu');$('helpDialog').showModal()};$('back').onclick=()=>showHelp('menu');$('closeHelp').onclick=()=>$('helpDialog').close();
// Restore selections and calculated output after an intentional update.
try{const saved=JSON.parse(sessionStorage.getItem('iv-update-values')||'null');sessionStorage.removeItem('iv-update-values');const values=Array.isArray(saved)?saved:saved?.values;if(Array.isArray(values)&&values.length===3&&values.every(v=>v===null||(Number.isInteger(v)&&v>=0&&v<=15))){values.forEach((v,i)=>vals[i]=v);render();if(saved?.calculated===true&&!vals.includes(null))$('out').textContent=Math.round(vals.reduce((a,b)=>a+b,0)/45*100)+vals.map(v=>circles[v]).join('')}}catch(e){}
if('serviceWorker' in navigator && location.protocol==='https:'){
 const VERSION='1.2.1'; let reg, applying=false, candidate=null, generation=0;
 const btn=$('update');
 function versionOf(w){return new Promise(resolve=>{const ch=new MessageChannel();const timer=setTimeout(()=>{ch.port1.close();resolve(null)},1500);ch.port1.onmessage=e=>{clearTimeout(timer);ch.port1.close();resolve(e.data?.version||null)};try{w.postMessage({type:'GET_VERSION'},[ch.port2])}catch(e){clearTimeout(timer);resolve(null)}})}
 function newer(v){if(!/^\d+\.\d+\.\d+$/.test(v||''))return false;const a=v.split('.').map(Number),b=VERSION.split('.').map(Number);for(let i=0;i<3;i++){if(a[i]!==b[i])return a[i]>b[i]}return false}
 async function refresh(){const g=++generation,w=reg?.waiting; if(applying)return; const v=w?await versionOf(w):null;if(g!==generation||applying)return;candidate=w&&reg.waiting===w&&newer(v)?w:null;btn.hidden=!candidate;btn.disabled=false;btn.textContent='Update available — Tap to update';}
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(applying){location.reload()}else refresh()});
 btn.onclick=()=>{if(!candidate||reg.waiting!==candidate){refresh();return}try{sessionStorage.setItem('iv-update-values',JSON.stringify({values:vals,calculated:$('out').textContent!=='—'}))}catch(e){}applying=true;btn.disabled=true;btn.textContent='Updating…';candidate.postMessage({type:'SKIP_WAITING'});setTimeout(()=>{if(applying){applying=false;refresh()}},10000)};
 navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>{reg=r;const watch=w=>w?.addEventListener('statechange',refresh);watch(r.installing);r.addEventListener('updatefound',()=>watch(r.installing));const check=()=>{refresh();if(navigator.onLine)r.update().then(refresh).catch(()=>{})};document.addEventListener('visibilitychange',()=>{if(!document.hidden)check()});window.addEventListener('online',check);window.addEventListener('focus',check);check()}).catch(()=>{});
}
</script></body></html>
